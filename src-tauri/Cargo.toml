[package]
name = "dinero"
version = "0.1.0"
description = "Dinero — локальный учёт личных финансов по банковским выпискам"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dinero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Just to find the OS config dir for the vault pointer file before the
# Tauri app exists — tauri-plugin-dialog pulls it in transitively anyway.
dirs = "7"
# Device name for the lock-file conflict dialog (SPEC-2.md 2.1).
gethostname = "0.5"
# Calendar day/week math for backup rotation (SPEC-2.md 2.2) and log
# timestamps — doing that by hand on top of SystemTime invites date bugs.
chrono = { version = "0.4", features = ["clock"] }
# Official "reveal in file manager" plugin, for the logs-folder button
# (SPEC-2.md 2.4) — avoids hand-rolling xdg-open/explorer/open per OS.
tauri-plugin-opener = "2"
# Ф8 (SPEC-2.md 9.2): the app's first network access, to download KASE
# share prices. Goes through this plugin (not the webview's own fetch) so
# the domain allowlist in capabilities/default.json is actually enforced —
# a plain webview fetch would just hit CORS instead.
tauri-plugin-http = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
